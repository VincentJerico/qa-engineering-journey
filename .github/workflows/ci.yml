name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, 04:00 Philippine time: the full suite on Chromium, Firefox and WebKit. The apps under
    # test are live public sites, so this also catches them changing while the code doesn't.
    - cron: '0 20 * * *'
  workflow_dispatch: # manual runs from the Actions tab
    inputs:
      cross_browser:
        description: 'Run the UI suite on Firefox and WebKit too'
        type: boolean
        default: false

# Every job only reads the repo.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes. Scheduled runs never cancel.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  sanity-check:
    name: Repository sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show repository structure
        run: |
          echo "Repository tree (top 2 levels):"
          find . -maxdepth 2 -not -path './.git/*' | sort

      - name: Verify required files exist
        run: |
          set -e
          for f in README.md LICENSE .gitignore; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f" && exit 1
            fi
          done

  ui-tests:
    name: Playwright UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one engine failing shouldn't hide the others' results
      matrix:
        # Chromium on every push and PR; all three engines nightly or on request.
        browser: ${{ fromJSON((github.event_name == 'schedule' || inputs.cross_browser) && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    defaults:
      run:
        working-directory: 04-automation/ui
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-automation/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node ../../09-ci-cd/summary/playwright-summary.mjs results.json "UI tests (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: 04-automation/ui/playwright-report/
          retention-days: 14

  api-tests:
    name: Playwright API tests (Restful-Booker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 04-automation/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-automation/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright test # request API only, no browser install needed
      - name: Job summary
        if: ${{ !cancelled() }}
        run: node ../../09-ci-cd/summary/playwright-summary.mjs results.json "API tests" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-api-report
          path: 04-automation/api/playwright-report/
          retention-days: 14

  traceability:
    name: Traceability gate (manual cases <-> automated tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            04-automation/ui/package-lock.json
            04-automation/api/package-lock.json
      # Playwright is needed to list the tests; no browsers, because --list doesn't launch one.
      - run: npm ci --prefix 04-automation/ui && npm ci --prefix 04-automation/api
      - run: node 09-ci-cd/traceability/selftest.mjs
      - run: node 09-ci-cd/traceability/trace.mjs

  ai-evals:
    name: AI eval harness (mock model)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 08-ai-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node eval/run-evals.mjs # no dependencies; exits non-zero on any eval failure

  sql-checks:
    name: SQL data-validation checks (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - run: 05-sql-testing/selftest.sh # proves the check can fail before trusting it
      - run: 05-sql-testing/check.sh

  k6-scripts:
    name: k6 scripts compile (no load generated)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 06-performance-testing
    steps:
      - uses: actions/checkout@v7
      - uses: grafana/setup-k6-action@v1
      - name: Self-test (a broken script must not compile)
        run: |
          if k6 inspect selftest/broken-script.js > /dev/null 2>&1; then
            echo "FAIL: k6 accepted selftest/broken-script.js, so this gate can't catch a broken script"; exit 1
          fi
          echo "PASS: k6 rejects a broken script"
      - run: for s in scripts/*.js; do k6 inspect "$s" > /dev/null; echo "OK $s"; done

  # One table with every gate's result, and one check that is green only if all of them are.
  all-gates:
    name: All gates
    if: ${{ !cancelled() }}
    needs: [sanity-check, ui-tests, api-tests, traceability, ai-evals, sql-checks, k6-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise gate results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) =>
              `| ${job} | ${result === "success" ? "PASS" : result.toUpperCase()} |`);
            const ok = Object.values(needs).every((n) => n.result === "success");
            console.log([`### All gates: ${ok ? "PASS" : "FAIL"}`, "", "| Job | Result |", "| --- | --- |", ...rows, ""].join("\n"));
            process.exitCode = ok ? 0 : 1;
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
