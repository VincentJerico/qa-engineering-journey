name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  sanity-check:
    name: Repository sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show repository structure
        run: |
          echo "Repository tree (top 2 levels):"
          find . -maxdepth 2 -not -path './.git/*' | sort

      - name: Verify required files exist
        run: |
          set -e
          for f in README.md LICENSE .gitignore; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f" && exit 1
            fi
          done

  # ---------------------------------------------------------------------------
  # Placeholder jobs for when tests are added. Uncomment and adapt as needed.
  # ---------------------------------------------------------------------------

  # api-tests:
  #   name: API tests (Playwright / Postman / etc.)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: 22
  #     - run: npm ci
  #     - run: npm test

  ui-tests:
    name: Playwright UI tests (SauceDemo + The Internet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-automation/ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-automation/ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: 04-automation/ui/playwright-report/
          retention-days: 14

  api-tests:
    name: Playwright API tests (Restful-Booker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-automation/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-automation/api/package-lock.json
      - run: npm ci
      - run: npx playwright test  # request API only — no browser install needed
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-api-report
          path: 04-automation/api/playwright-report/
          retention-days: 14
